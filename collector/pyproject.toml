[project]
name = "gamani-collector"
version = "0.1.0"
description = "Gamani Lab V2 vehicle data collector"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "httpx>=0.28.1",
  "psycopg[binary]>=3.3,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
gamani-db-check = "gamani_collector.db:main"
gamani-collect-listings = "gamani_collector.collect_listings:main"
gamani-collect-canary = "gamani_collector.collect_vehicle_data:main"
gamani-collect = "gamani_collector.bulk_collect:main"
gamani-sync-option-catalog = "gamani_collector.sync_option_catalog:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamani_collector"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
